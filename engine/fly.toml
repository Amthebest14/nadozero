# app name is set on `fly apps create` / `fly launch` — this file assumes
# that's already been done and just describes how the one app should run.
app = "nadozero-mirror"
primary_region = "nrt"  # Tokyo — closest to Nado's own infrastructure

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/nadozero.db"
  # ALLOWED_ORIGIN intentionally unset for now (defaults to "*" in code) —
  # tighten this to the real frontend origin once it's deployed.

[[mounts]]
  source = "nadozero_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # This is NOT a scale-to-zero web app — it holds open WebSocket
  # connections watching leaders continuously. Fly's default idle-scaling
  # would silently kill those. Must stay on, always, exactly one machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
